<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع عمر</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Cairo', sans-serif;
  background: radial-gradient(circle at top, #0f2027, #000000);
  color: white; min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  text-align: center;
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(0,255,136,0.3);
  backdrop-filter: blur(10px);
  padding: 50px; border-radius: 30px;
  box-shadow: 0 0 40px rgba(0,255,136,0.2);
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
h1 { font-size: 55px; color: #00ff88; text-shadow: 0 0 20px #00ff88; }
p { font-size: 20px; margin: 15px 0; opacity: 0.8; }
.btn {
  display: inline-block; margin-top: 25px;
  padding: 15px 35px; font-size: 18px; font-weight: bold;
  background: #00ff88; color: #000; border-radius: 50px;
  text-decoration: none; border: none; cursor: pointer;
  box-shadow: 0 0 20px #00ff88;
  transition: 0.3s;
}
.btn:hover { transform: scale(1.1); box-shadow: 0 0 40px #00ff88; }
.links { margin-top: 20px; font-size: 14px; opacity: 0.5; }
</style>
</head>
<body>
<div class="card">
  <h1>أهلا بالعالم! أنا عمر 😎</h1>
  <p>مطور مواقع المستقبل - أول موقع ليا</p>
  <button class="btn" onclick="alert('عاااش يا عمر! انت جامد فشخ 🔥')">دوس هنا يا بطل</button>
  <div class="links">Made with ❤️ by Omar</div>
</div>
</body>
</html>
